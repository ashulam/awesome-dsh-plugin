url: https://github.com/ashulam/dsh-session-delete
name: ashulam/dsh-session-delete
category: session
description:
  en: 'Deletes a session from the sidebar context menu: its log and replay cache go to the Recycle Bin; a live session is queued for removal on the next start.'
  zh: '在侧栏会话右键菜单里删除会话：日志与投影缓存移入回收站；正在使用的会话排队到下次启动时删除。'